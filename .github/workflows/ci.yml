name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      - run: mix credo
      # The pass/fail gate: includes the multi-node (:distributed) suite;
      # setup-beam provides epmd.
      - run: mix test --include distributed
      # Coverage report (advisory — the failing-threshold knob is unreliable
      # across Elixir versions, so this informs but does not gate).
      - name: Coverage (advisory)
        run: mix test --include distributed --cover
        continue-on-error: true

  # The load-bearing durability / idempotency / gap-free / CP-fence contract lives
  # in the REAL Locus adapter, tagged :locus. The default `test` job cannot run it
  # (no Locus binary) and would SILENTLY skip it. This job builds Locus and runs the
  # suite with LOCUS_REQUIRED=1 so a missing binary or an excluded tag FAILS the run
  # rather than passing green (test gap #1). Gates releases on the fence-race test.
  locus-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Locus sibling repo
        uses: actions/checkout@v4
        with:
          repository: elementaio/locus
          path: locus-src

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the Locus build
        uses: actions/cache@v4
        with:
          path: locus-src/target
          key: ${{ runner.os }}-locus-${{ hashFiles('locus-src/Cargo.lock') }}

      - name: Build Locus (default zero-dep build)
        run: cargo build --release --manifest-path locus-src/Cargo.toml

      - run: mix deps.get
      # LOCUS_BIN points the suite at the just-built binary; LOCUS_REQUIRED=1 turns a
      # missing binary / skipped :locus tag into a HARD failure.
      - name: Run the real-adapter contract + fence suite
        env:
          LOCUS_BIN: ${{ github.workspace }}/locus-src/target/release/locus
          LOCUS_REQUIRED: "1"
        run: mix test --include locus --only locus

  dialyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # The PLT is expensive to build; cache it keyed on the lockfile + toolchain.
      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp27-elixir1.17-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-otp27-elixir1.17-

      - run: mix deps.get
      - run: mix dialyzer --format github
